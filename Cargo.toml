[package]
name = "fernhttp"
version = "0.1.0"
edition = "2021"
description = "Lightweight Apache log tailer: SQLite history + real-time HTTP dashboard (GoAccess-style, in Rust)"
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1